<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Página não encontrada | SIMPLES Comunicação</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
@font-face{font-family:"Arimo";src:url("/fonts/arimo-latin-400-normal.woff2") format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Arimo";src:url("/fonts/arimo-latin-700-normal.woff2") format("woff2");font-weight:700;font-display:swap}
@font-face{font-family:"Instrument Serif";src:url("/fonts/instrument-serif-latin-400-italic.woff2") format("woff2");font-weight:400;font-style:italic;font-display:swap}
:root{color-scheme:dark;--ink:#0B0B0A;--sand:#D3CBB6;--red:#E33939;--mute:#8E887A;--line:#34312B}
*{box-sizing:border-box}
html,body{margin:0;background:var(--ink);color:var(--sand)}
body{font-family:"Arimo","Helvetica Neue",Arial,sans-serif;font-size:17px;line-height:1.6;-webkit-font-smoothing:antialiased}
.wrap{max-width:760px;margin:0 auto;padding-top:clamp(28px,6vw,64px);padding-bottom:64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{display:flex;justify-content:space-between;gap:16px;align-items:center;padding-bottom:18px;border-bottom:1px solid var(--line);margin-bottom:clamp(36px,7vw,72px)}
.top a{color:var(--red);font-weight:700;letter-spacing:.06em;text-decoration:none}
.lbl{font-weight:700;font-size:.68rem;letter-spacing:.22em;text-transform:uppercase;color:var(--mute)}
h1{margin:0 0 28px;font-weight:700;text-transform:uppercase;font-size:clamp(2.4rem,8vw,4.4rem);line-height:.9;letter-spacing:-.04em}
h1 em{display:block;font-family:"Instrument Serif",Georgia,serif;font-style:italic;font-weight:400;text-transform:none;letter-spacing:-.01em;color:var(--red);font-size:1.1em}
h2{margin:40px 0 10px;font-size:1rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
p{margin:0 0 14px;max-width:62ch}
a{color:var(--sand)}
a:focus-visible{outline:2px solid var(--red);outline-offset:3px}
.foot{margin-top:56px;padding-top:18px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
</style>
</head>
<body>
<div class="wrap">
<header class="top"><a href="/">SIMPLES</a><span class="lbl">Erro 404</span></header>
<main>
<h1>Essa página <em>não existe.</em></h1>
<p>O endereço pode ter mudado, ou a página saiu do ar. O resto do site continua aqui.</p>
<p><a href="/">Voltar para o site da SIMPLES</a></p>
</main>
<footer class="foot lbl"><span>SIMPLES Comunicação</span><span>Viu? É simples.</span></footer>
</div>
</body>
</html>
